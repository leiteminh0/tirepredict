name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Um push novo cancela a execução anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Mesma versão da imagem Docker de produção (Dockerfile.backend).
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Aspas obrigatórias: o valor termina em ":", que o YAML leria como chave.
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: development
          ALERT_PRESSURE_THRESHOLD: "30"
        # `python -m` garante a raiz do repositório no sys.path (pytest.ini reforça).
        run: python -m pytest -v --tb=short

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 exige Node ^20.19 ou >=22.12; 20 mantém paridade com a imagem Docker.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # URL fictícia para o build de CI — não aponta para produção.
          # frontend/src/services/api.js falha de propósito sem ela.
          VITE_API_URL: http://localhost:8000
        run: npm run build
