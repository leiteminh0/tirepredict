[build]
builder = "nixpacks"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"

# Variáveis de Ambiente Obrigatórias:
#
# DATABASE_URL (OBRIGATÓRIO em produção)
# → PostgreSQL connection string
# → Formato: postgresql://user:password@host:5432/dbname
# → No Railway: referencia automaticamente ${{ Postgres.DATABASE_URL }}
# → Sem isso: fallback para SQLite (não persistente)
#
# MQTT_BROKER, MQTT_USER, MQTT_PASSWORD e MQTT_TOPIC (Opcional)
# → Configuracao do HiveMQ. Se algum estiver vazio, o subscriber fica desativado.
#
# MQTT_PORT (Opcional)
# → Padrao: 8883 (TLS)
#
# ADMIN_SEED_TOKEN (Opcional, recomendado apenas na primeira carga)
# → Protege POST /admin/seed; envie o mesmo valor no cabecalho X-Admin-Token.
